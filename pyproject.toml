[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assignment-03-mlops-agent"
version = "1.0.0"
requires-python = "==3.11.*"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "PyYAML>=6,<7",
  "mlflow-skinny>=2.15,<3",
  "dvc>=3.50,<4",
  "kubernetes>=30,<33",
  "openai>=1.40,<2",
]

[project.optional-dependencies]
airflow = ["apache-airflow==3.0.2"]
mlflow-server = ["mlflow>=2.15,<3", "sqlalchemy>=2.0,<2.1"]
dev = ["pytest>=8,<9", "ruff==0.14.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["agent*", "api*", "training*"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

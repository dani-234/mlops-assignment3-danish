apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-inference-deployment
  namespace: mlops-prod
  labels: {app: mlops-inference}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: mlops-inference}
  template:
    metadata:
      labels: {app: mlops-inference}
    spec:
      containers:
      - name: inference
        image: assignment-03-mlops-agent:local
        ports: [{containerPort: 8000}]
        envFrom: [{configMapRef: {name: mlops-config}}]
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
        readinessProbe: {httpGet: {path: /health/ready, port: 8000}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /health/live, port: 8000}, initialDelaySeconds: 5, periodSeconds: 10}

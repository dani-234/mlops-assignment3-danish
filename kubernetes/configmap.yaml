apiVersion: v1
kind: ConfigMap
metadata:
  name: mlops-config
  namespace: mlops-prod
data:
  MODEL_NAME: production-classifier
  MODEL_VERSION: local
  MODEL_ARTIFACT_PATH: /app/artifacts/model.joblib
  DATASET_PROVENANCE: unavailable-until-training
  APPROVED_NAMESPACE: mlops-prod
  LOG_LEVEL: INFO
  MLFLOW_TRACKING_URI: http://mlflow:5000
  FRESHNESS_MAX_DAYS: "14"
